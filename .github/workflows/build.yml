name: build
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cpu, vulkan: "false" }
          - { name: vulkan, vulkan: "true" }
    runs-on: ubuntu-24.04
    # The Vulkan cross-build is the riskiest part; don't let it sink the CPU build.
    continue-on-error: ${{ matrix.vulkan == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Disable buffer device address in ggml Vulkan
        if: matrix.vulkan == 'true'
        run: |
          VK=app/src/main/cpp/third_party/stable-diffusion.cpp/ggml/src/ggml-vulkan
          grep -rn "buffer_device_address = " "$VK" || true
          sed -i -E 's/(device->buffer_device_address = )[^;]+;/\1false;/' "$VK"/*.cpp
          echo "--- after patch ---"
          grep -rn "buffer_device_address = " "$VK" || echo "PATTERN NOT FOUND"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK pieces
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Vulkan headers
        if: matrix.vulkan == 'true'
        run: |
          git clone --depth 1 --branch v1.4.309 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vkh"
          git clone --depth 1 --branch vulkan-sdk-1.4.309.0 https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/spirv-src"
          cmake -S "$RUNNER_TEMP/spirv-src" -B "$RUNNER_TEMP/spirv-build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/spirv"
          cmake --install "$RUNNER_TEMP/spirv-build"
          find "$RUNNER_TEMP/spirv" -name SPIRV-HeadersConfig.cmake
          cp -r "$RUNNER_TEMP/spirv-src/include/spirv" "$RUNNER_TEMP/vkh/include/"
          test -f "$RUNNER_TEMP/vkh/include/spirv/unified1/spirv.hpp"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Patch ggml-vulkan for Mali (no buffer device address)
        if: matrix.vulkan == 'true'
        shell: bash
        run: |
          cd app/src/main/cpp/third_party/stable-diffusion.cpp/ggml/src/ggml-vulkan
          echo "--- before ---"
          grep -n "buffer_device_address" *.cpp *.h | head -30 || true
          sed -i -E 's/(buffer_device_address[[:space:]]*=[[:space:]]*)[^;=]+;/\1false;/' *.cpp *.h
          echo "--- after ---"
          grep -n "buffer_device_address" *.cpp *.h | head -30 || true
          grep -qE 'buffer_device_address[[:space:]]*=[[:space:]]*false;' *.cpp *.h || { echo "PATCH DID NOT APPLY"; exit 1; }
      - name: Build
        shell: bash
        run: |
          SPIRV_DIR=$(find "$RUNNER_TEMP/spirv" -name SPIRV-HeadersConfig.cmake -printf '%h' 2>/dev/null | head -n1 || true)
          gradle :app:assembleRelease -PanimaVulkan=${{ matrix.vulkan }} -PvkHeaders="$RUNNER_TEMP/vkh" -PspirvPrefix="$RUNNER_TEMP/spirv" -PspirvDir="$SPIRV_DIR" 2>&1 | tee build.log
      - name: Error summary
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || { echo "no build.log: open the failed step above"; exit 0; }
          grep -n -E "FAILED:|error:|CMake Error|fatal error|What went wrong" build.log | head -40 || true
          echo "----- last 40 lines -----"
          tail -n 40 build.log
      - name: Rename
        run: mv app/build/outputs/apk/release/app-release.apk anima-${{ matrix.name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: anima-${{ matrix.name }}
          path: anima-${{ matrix.name }}.apk

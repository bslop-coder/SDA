name: build
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cpu, vulkan: "false" }
          - { name: vulkan, vulkan: "true" }
    runs-on: ubuntu-24.04
    # The Vulkan cross-build is the riskiest part; don't let it sink the CPU build.
    continue-on-error: ${{ matrix.vulkan == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK pieces
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Vulkan headers
        if: matrix.vulkan == 'true'
        run: |
          git clone --depth 1 --branch v1.4.309 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vkh"
          git clone --depth 1 --branch vulkan-sdk-1.4.309.0 https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/spirv-src"
          cmake -S "$RUNNER_TEMP/spirv-src" -B "$RUNNER_TEMP/spirv-build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/spirv"
          cmake --install "$RUNNER_TEMP/spirv-build"
          find "$RUNNER_TEMP/spirv" -name SPIRV-HeadersConfig.cmake
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        shell: bash
        run: |
          SPIRV_DIR=$(find "$RUNNER_TEMP/spirv" -name SPIRV-HeadersConfig.cmake -printf '%h' 2>/dev/null | head -n1 || true)
          gradle :app:assembleRelease -PanimaVulkan=${{ matrix.vulkan }} -PvkHeaders="$RUNNER_TEMP/vkh" -PspirvPrefix="$RUNNER_TEMP/spirv" -PspirvDir="$SPIRV_DIR" 2>&1 | tee build.log
      - name: Error summary
        if: failure()
        shell: bash
        run: |
          grep -n -E "FAILED:|error:|CMake Error|fatal error|What went wrong" build.log | head -40 || true
          echo "----- last 40 lines -----"
          tail -n 40 build.log
      - name: Rename
        run: mv app/build/outputs/apk/release/app-release.apk anima-${{ matrix.name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: anima-${{ matrix.name }}
          path: anima-${{ matrix.name }}.apk
